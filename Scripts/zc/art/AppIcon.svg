<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>zContainer</title>
  <!--
    zContainer's app icon, the source of every icon PNG (render-icon.sh).
    A full-bleed square: iOS masks it to its own shape, so no corners are drawn.
    A Home Screen's worth of apps, four by four, in white on Zeus's pink, the
    tiles fading from the top left. render-icon.sh recolors the two gradient
    stops for the tinted and grey icons.
  -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E64BAE"/>
      <stop offset="1" stop-color="#A3156F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect x="196" y="196" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="363" y="196" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.88"/>
  <rect x="530" y="196" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.81"/>
  <rect x="697" y="196" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.74"/>
  <rect x="196" y="363" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.88"/>
  <rect x="363" y="363" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.81"/>
  <rect x="530" y="363" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.74"/>
  <rect x="697" y="363" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.67"/>
  <rect x="196" y="530" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.81"/>
  <rect x="363" y="530" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.74"/>
  <rect x="530" y="530" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.67"/>
  <rect x="697" y="530" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.60"/>
  <rect x="196" y="697" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.74"/>
  <rect x="363" y="697" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.67"/>
  <rect x="530" y="697" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.60"/>
  <rect x="697" y="697" width="131" height="131" rx="34" fill="#FFFFFF" fill-opacity="0.53"/>
</svg>
